name: CI
on:
  push:
    branches: [main]
  pull_request:
  workflow_call:
permissions:
  contents: read
jobs:
  desktop:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: '22'
          cache: npm
      - uses: actions/setup-python@v6
        with:
          python-version: '3.11'
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - name: Linux desktop prerequisites
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libwebkit2gtk-4.1-dev libayatana-appindicator3-dev librsvg2-dev patchelf webkit2gtk-driver xvfb dbus-x11
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
      - run: cargo fmt --all -- --check
      - run: cargo clippy -p desktop-manager --all-targets --locked -- -D warnings
      - run: cargo test -p desktop-manager --locked
      - name: Build through the actual native Tauri CLI
        run: npm run tauri build -- --debug --no-bundle -- --locked
      - name: Verify native binary private supervision entry
        if: runner.os != 'Windows'
        shell: bash
        run: DESKTOP_SUPERVISOR_BIN="$PWD/target/debug/coding-tools-mcp-desktop-native" cargo test -p desktop-manager --test lifecycle --locked
      - name: Install native UI acceptance prerequisites
        if: runner.os == 'Linux'
        run: |
          cargo install tauri-driver --version 2.0.6 --locked
          python -m pip install 'selenium==4.50.0' 'coding-tools-mcp @ git+https://github.com/xyTom/coding-tools-mcp.git@d7c2dda48bcedbd066c7dbc24a1b63205384d269'
      - run: python tests/native_ui_smoke.py --self-test
      - name: Exercise real native WebKit UI and unchanged external core
        if: runner.os == 'Linux'
        timeout-minutes: 5
        env:
          CODING_TOOLS_MCP_TELEMETRY: 'off'
          DO_NOT_TRACK: '1'
        run: dbus-run-session -- xvfb-run -a python tests/native_ui_smoke.py --binary "$PWD/target/debug/coding-tools-mcp-desktop-native" --core "$(command -v coding-tools-mcp)" --artifacts artifacts/native-ui
      - uses: actions/upload-artifact@v6
        if: always() && runner.os == 'Linux'
        with:
          name: native-ui-results
          path: artifacts/native-ui/
      - run: python -m pip install -e ".[dev]"
      - run: python -m ruff check mcp_desktop_client tests
      - run: python -m unittest discover -s tests -p "test_*.py"
  browser:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: npm run test:e2e
      - uses: actions/upload-artifact@v6
        if: always()
        with:
          name: browser-test-results
          path: |
            test-results/
            screenshots/*.png
            playwright-report/
  core-acceptance:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        core: [published, event-capable]
        include:
          - core: published
            source: 'coding-tools-mcp==0.5.0'
            activity: 'false'
            label: published-0.5.0
          - core: event-capable
            source: 'git+https://github.com/xyTom/coding-tools-mcp.git@d7c2dda48bcedbd066c7dbc24a1b63205384d269'
            activity: 'true'
            label: official-event-capable-commit
    name: Core acceptance (${{ matrix.os }}, ${{ matrix.label }})
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: '3.11'
      - uses: dtolnay/rust-toolchain@stable
      - name: Install exact unchanged official core fixture
        run: python -m pip install '${{ matrix.source }}'
      - name: Exercise real MCP calls and capability detection
        env:
          DESKTOP_CORE_COMMAND_JSON: '["coding-tools-mcp"]'
          DESKTOP_EXPECT_ACTIVITY: ${{ matrix.activity }}
          CODING_TOOLS_MCP_TELEMETRY: 'off'
          DO_NOT_TRACK: '1'
        run: cargo test -p desktop-manager official_core_mcp_acceptance --locked -- --ignored
  package:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: '3.11'
      - run: python -m pip install --upgrade build twine
      - run: python -m build
      - run: python -m twine check dist/*
      - name: Verify compatibility wheel boundary
        run: |
          python - <<'PY'
          import glob
          import zipfile
          wheels = glob.glob("dist/*.whl")
          assert len(wheels) == 1, wheels
          with zipfile.ZipFile(wheels[0]) as archive:
              names = set(archive.namelist())
              assert "mcp_desktop_client/app.py" in names
              assert not any(name.startswith("coding_tools_mcp/") for name in names)
              assert not any(name.endswith(("runtime.py", ".qm")) for name in names)
              assert any(name.endswith(".dist-info/NOTICE") for name in names)
              entrypoints = archive.read(next(name for name in names if name.endswith("entry_points.txt"))).decode()
              assert "coding-tools-mcp-desktop = mcp_desktop_client.app:main" in entrypoints
          PY
