name: Build native bundles
on:
  push:
    branches: [fix/pr-1-qa-followups]
  pull_request:
    paths:
      - 'src/**'
      - 'src-tauri/**'
      - 'crates/**'
      - 'Cargo.toml'
      - 'Cargo.lock'
      - 'package.json'
      - 'package-lock.json'
      - 'vite.config.ts'
      - 'tsconfig*.json'
      - 'index.html'
      - 'scripts/prepare-bundled-uv.py'
      - '.github/workflows/native-bundles.yml'
      - 'scripts/test-windows-installer.ps1'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  bundles:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, macos-latest, macos-15-intel, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: '22'
          cache: npm
      - uses: dtolnay/rust-toolchain@stable
      - uses: actions/setup-python@v6
        with:
          python-version: '3.11'
      - name: Stage checksum-verified Core installer sidecar
        run: python scripts/prepare-bundled-uv.py
      - name: Exercise bundled installer and download an isolated Python and Core
        shell: bash
        timeout-minutes: 8
        run: |
          host="$(rustc --print host-tuple)"
          exe="src-tauri/gen/runtime-installer/coding-tools-mcp-uv-$host"
          if [[ "$host" == *-windows-* ]]; then exe="$exe.exe"; fi
          "$exe" --version
          export DESKTOP_BUNDLED_UV_ACCEPTANCE="$(python -c 'from pathlib import Path; import sys; print(Path(sys.argv[1]).resolve())' "$exe")"
          cargo test -p desktop-manager --locked --lib core::tests::packaged_uv_isolates_a_real_managed_python_install -- --ignored --exact
      - name: Linux prerequisites
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libwebkit2gtk-4.1-dev libayatana-appindicator3-dev librsvg2-dev patchelf
      - run: npm ci
      - run: npm run tauri build -- --config src-tauri/gen/runtime-installer/tauri-runtime.json -- --locked
      - name: Check native Linux installer and license resources
        if: runner.os == 'Linux'
        run: |
          bundle_root="$(mktemp -d)"
          trap 'rm -rf "$bundle_root"' EXIT
          dpkg-deb --extract target/release/bundle/deb/*.deb "$bundle_root"
          helper="$bundle_root/usr/bin/coding-tools-mcp-uv"
          test -f "$helper"
          test -x "$helper"
          test "$("$helper" --version | cut -d' ' -f2)" = "$(python scripts/prepare-bundled-uv.py --version)"
          resources="$bundle_root/usr/lib/Coding Tools MCP"
          for license in LICENSE NOTICE third-party/uv/LICENSE-MIT third-party/uv/LICENSE-APACHE; do
            test -s "$resources/$license" || { echo "Missing package resource: $license"; exit 1; }
          done
      - name: Check macOS application includes executable installer
        if: runner.os == 'macOS'
        shell: bash
        run: |
          helper="$(find target/release/bundle/macos -path '*/Contents/MacOS/coding-tools-mcp-uv' -type f)"
          test -n "$helper" && test -x "$helper"
          "$helper" --version
      - uses: actions/upload-artifact@v6
        with:
          name: native-bundles-${{ matrix.os }}
          path: |
            target/release/bundle/**/*.deb
            target/release/bundle/**/*.rpm
            target/release/bundle/**/*.AppImage
            target/release/bundle/**/*.dmg
            target/release/bundle/**/*.msi
            target/release/bundle/**/*.exe
      - uses: actions/upload-artifact@v6
        if: runner.os == 'Linux'
        with:
          name: native-linux-deb
          path: target/release/bundle/deb/*.deb
  windows-quiet-install:
    name: Windows quiet install (${{ matrix.installer }})
    needs: bundles
    # The Windows artifact is required, not a green Linux/macOS build.
    if: ${{ !cancelled() }}
    runs-on: windows-latest
    timeout-minutes: 12
    strategy:
      fail-fast: false
      matrix:
        installer: [msi, nsis]
    steps:
      - uses: actions/checkout@v6
      - uses: actions/download-artifact@v7
        with:
          name: native-bundles-windows-latest
          path: native-bundles
      - name: Exercise exact Windows bundle
        shell: pwsh
        env:
          INSTALLER: ${{ matrix.installer }}
        run: |
          $pattern = if ($env:INSTALLER -eq 'msi') { '*.msi' } else { '*-setup.exe' }
          $files = @(Get-ChildItem native-bundles -Recurse -File -Filter $pattern)
          if ($files.Count -ne 1) { throw "Expected exactly one $pattern; found $($files.Count)." }
          $uvVersion = python scripts/prepare-bundled-uv.py --version
          if ($LASTEXITCODE -ne 0 -or -not $uvVersion) { throw 'Could not read the bundled uv version pin.' }
          ./scripts/test-windows-installer.ps1 -Kind $env:INSTALLER `
            -BundlePath $files[0].FullName -LogDirectory windows-installer-logs `
            -DisposableMachine -TimeoutSeconds 180 -ExpectedBundledUvVersion $uvVersion
      - uses: actions/upload-artifact@v6
        if: always()
        with:
          name: windows-quiet-install-${{ matrix.installer }}
          path: windows-installer-logs/
          if-no-files-found: warn

# Builds review artifacts only. Publishing/signing a release is a separate explicit step.
