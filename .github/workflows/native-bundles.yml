name: Build native bundles
on:
  pull_request:
    paths:
      - 'src/**'
      - 'src-tauri/**'
      - 'crates/**'
      - 'Cargo.toml'
      - 'Cargo.lock'
      - 'package.json'
      - 'package-lock.json'
      - 'vite.config.ts'
      - 'tsconfig*.json'
      - 'index.html'
      - '.github/workflows/native-bundles.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  bundles:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, macos-15-intel, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: '22'
          cache: npm
      - uses: dtolnay/rust-toolchain@stable
      - name: Linux prerequisites
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libwebkit2gtk-4.1-dev libayatana-appindicator3-dev librsvg2-dev patchelf
      - run: npm ci
      - run: npm run tauri build -- -- --locked
      - name: Check native Linux license resources
        if: runner.os == 'Linux'
        run: |
          dpkg-deb --contents target/release/bundle/deb/*.deb > bundle-contents.txt
          grep '/LICENSE$' bundle-contents.txt
          grep '/NOTICE$' bundle-contents.txt
      - uses: actions/upload-artifact@v6
        with:
          name: native-bundles-${{ matrix.os }}
          path: |
            target/release/bundle/**/*.deb
            target/release/bundle/**/*.rpm
            target/release/bundle/**/*.AppImage
            target/release/bundle/**/*.dmg
            target/release/bundle/**/*.msi
            target/release/bundle/**/*.exe
      - uses: actions/upload-artifact@v6
        if: runner.os == 'Linux'
        with:
          name: native-linux-deb
          path: target/release/bundle/deb/*.deb
# Builds review artifacts only. Publishing/signing a release is a separate explicit step.
