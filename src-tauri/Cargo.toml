[package]
name = "coding-tools-mcp-desktop-native"
version = "0.2.0"
edition = "2021"
rust-version = "1.85"
license = "Apache-2.0"
build = "build.rs"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
desktop-manager = { path = "../crates/desktop-manager" }
tauri = { version = "2", features = ["tray-icon"] }
tauri-plugin-single-instance = "2"
tauri-plugin-dialog = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
open = "5"
