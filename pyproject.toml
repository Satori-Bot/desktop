[build-system]
requires = ["setuptools>=68,<77"]
build-backend = "setuptools.build_meta"

[project]
name = "coding-tools-mcp-desktop"
version = "0.1.0"
description = "Desktop application for running and managing Coding Tools MCP."
requires-python = ">=3.11"
dependencies = [
  "coding-tools-mcp>=0.5,<1",
  "PySide6>=6.8,<6.9",
  "psutil>=7.0,<8",
]
readme = "README.md"
license = { file = "LICENSE" }
authors = [{ name = "Coding Tools MCP Contributors" }]
classifiers = [
  "License :: OSI Approved :: Apache Software License",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.11",
]

[project.optional-dependencies]
dev = [
  "build>=1.2",
  "ruff>=0.15,<0.16",
  "twine>=6.0",
]

[project.urls]
Homepage = "https://github.com/coding-tools-mcp/desktop"
Documentation = "https://github.com/coding-tools-mcp/docs"
Source = "https://github.com/coding-tools-mcp/desktop"
Issues = "https://github.com/coding-tools-mcp/desktop/issues"

[project.scripts]
coding-tools-mcp-desktop = "mcp_desktop_client.app:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["mcp_desktop_client*"]

[tool.setuptools.package-data]
mcp_desktop_client = ["locales/*.qm", "locales/*.ts"]
